# Phase 1 gate: invariants, hand-written logs and golden hashes run on every push.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0  # pinned to the local toolchain: new stable releases add clippy lints
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # insta fails on any snapshot change in CI: golden hashes need an explicit sign-off.
      - run: cargo test --all
        env:
          INSTA_UPDATE: "no"
          CI: "true"
