[package]
name = "server"
description = "Live mode: the simulation on one engine thread, one rtrb ring per reader, an axum websocket for the dashboard."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sim = { path = "../sim" }
engine.workspace = true
metrics.workspace = true
clap.workspace = true
serde.workspace = true
serde_json = "1"
rtrb = "0.3"
hdrhistogram = "7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[[bin]]
name = "stale-quotes-server"
path = "src/main.rs"
