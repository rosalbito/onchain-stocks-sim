[package]
name = "bench"
description = "Engine benchmark (spec section 10, architecture section 8): per-message and per-block cost, allocations per message, load profiles and the channel layer comparison."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
engine.workspace = true
sim = { path = "../sim" }
clap.workspace = true
rand_core.workspace = true
rand_chacha.workspace = true
hdrhistogram = "7"
rtrb = "0.3"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[[bin]]
name = "bench"
path = "src/main.rs"
