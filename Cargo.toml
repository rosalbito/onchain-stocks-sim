[workspace]
resolver = "2"
members = ["crates/engine", "crates/metrics"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
engine = { path = "crates/engine" }
metrics = { path = "crates/metrics" }
slab = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
postcard = { version = "1", features = ["alloc"] }
rand_core = "0.9"
rand_chacha = "0.9"
libm = "0.2"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
proptest = "1"
insta = "1"

[profile.test]
opt-level = 2
